robot_controller:
  ros__parameters:
    # PCA9685 motor channel index (single channel per motor -- see
    # robot_controller.cpp declare_parameter<int>("left_motor"/"right_motor")
    # and README.md). Values below match the node's own defaults (0/1); this
    # file used to set left_motor_forward_channel/left_motor_reverse_channel/
    # right_motor_forward_channel/right_motor_reverse_channel instead, which
    # robot_controller.cpp never declares, so those four keys were silently
    # ignored by rclcpp and the node always ran on channels 0/1 regardless.
    left_motor: 0
    left_motor_alpha: 1.0
    left_motor_beta: 0.0

    right_motor: 1
    right_motor_alpha: 1.0
    right_motor_beta: 0.0

    track_width: 0.11
    max_linear_velocity: 1.0
    max_angular_velocity: 2.0
